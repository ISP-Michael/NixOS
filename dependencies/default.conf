[ids]
*

[main]
# Уменьшен таймаут для мгновенного отклика
leftalt = timeout(layer(lalt_layer), 200, leftalt)
rightalt = timeout(layer(ralt_layer), 200, rightalt)

[lalt_layer]
# Навигация (Vim-style)
h = left
j = down
k = up
l = right

# Служебные
e = escape
[ = backspace
] = delete
' = enter
; = tab

# Мультимедиа и яркость
1 = brightnessdown
2 = brightnessup
4 = mute
5 = volumedown
6 = volumeup
- = sysrq

# ГЛАВНОЕ: Теперь система видит это как реальный Shift
/ = layer(shift)

[ralt_layer]
# Цифровой ряд и спецсимволы
tab = `
q = 1
w = 2
e = 3
r = 4
t = 5
y = 6
u = 7
i = 8
o = 9
p = 0
[ = -
] = =

# Символы через Shift (S-)
capslock = S-`
a = S-1
s = S-2
d = S-3
f = S-4
g = S-5
h = S-6
j = S-7
k = S-8
l = S-9
; = S-0
' = _
/ = +

# Функциональный ряд
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
- = f11
= = f12

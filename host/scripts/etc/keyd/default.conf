[ids]
*

[main]
# Уменьшен таймаут для мгновенного отклика
leftalt = timeout(layer(lalt_layer), 200, leftalt)
rightalt = timeout(layer(ralt_layer), 200, rightalt)

[lalt_layer]
# Навигация (Vim-style)
h = left
j = down
k = up
l = right

# Служебные
e = escape
[ = backspace
] = delete
' = enter
; = tab

# Мультимедиа и яркость
1 = brightnessdown
2 = brightnessup
4 = mute
5 = volumedown
6 = volumeup
- = sysrq

# Слой для набора текста с заглавными буквами
# layer(shift) только держит модификатор и НЕ перекрывает e = escape из lalt_layer
/ = layer(lalt_shift)

[lalt_shift]
a = S-a
b = S-b
c = S-c
d = S-d
e = S-e
f = S-f
g = S-g
h = S-h
i = S-i
j = S-j
k = S-k
l = S-l
m = S-m
n = S-n
o = S-o
p = S-p
q = S-q
r = S-r
s = S-s
t = S-t
u = S-u
v = S-v
w = S-w
x = S-x
y = S-y
z = S-z

[ralt_layer]
# Цифровой ряд и спецсимволы
tab = `
q = 1
w = 2
e = 3
r = 4
t = 5
y = 6
u = 7
i = 8
o = 9
p = 0
[ = -
] = =

# Символы через Shift (S-)
capslock = S-`
a = S-1
s = S-2
d = S-3
f = S-4
g = S-5
h = S-6
j = S-7
k = S-8
l = S-9
; = S-0
' = _
/ = +

# Функциональный ряд
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
- = f11
= = f12

disable_ligatures no
shell_integration no
cursor_trail 1
cursor none
cursor_text_color background
cursor_shape block
cursor_blink_interval 0
touch_scroll_multiplier 3.0
copy_on_select yes
window_padding_width 5
confirm_os_window_close 0

tab_bar_style fade
tab_bar_edge top
active_tab_background   #242933
inactive_tab_background #1D2129
active_tab_foreground   #BFBEB7
inactive_tab_foreground #48525D

background_opacity 1.0
background_image none
selection_background none
selection_foreground none
foreground #c0caf5
background #1a1b26
repaint_delay 2
input_delay 0

font_family FiraCode Nerd Font
font_size 11.75

font_features FiraCodeNF-Reg +ss01 +ss03 +ss06 +ss07 +ss10 +cv02 +cv18 +cv25 +cv26 +cv27 +cv29 +cv30 +cv32 +zero
# font_features FiraCode +ss01 +ss03 +ss06 +ss07 +ss10 +cv02 +cv18 +cv25 +cv26 +cv27 +cv29 +cv30 +cv32 +zero

map ctrl+shift+f select_tab


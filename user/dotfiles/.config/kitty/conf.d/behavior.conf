# Input, scrolling, clipboard and shell integration.
#
# 0.49 uses `enabled`/`disabled` (or a list of no-* flags); the old `no` is
# rejected and silently ignored. Keep integration disabled: tmux/zsh already
# own the prompt and session environment.
shell_integration disabled

touch_scroll_multiplier 3.0
copy_on_select           yes
window_padding_width     5
confirm_os_window_close  0

repaint_delay        6
input_delay          0
sync_to_monitor      no
resize_debounce_time 0.01

# Kitty keeps its own scrollback; tmux has 50000 lines.
scrollback_lines 10000

# No audio beeps from the terminal itself.
enable_audio_bell no

# URLs under the mouse are clickable and can be opened with the hints kitten.
allow_hyperlinks yes
detect_urls      yes
url_style        curly

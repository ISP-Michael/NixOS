# Fonts and ligatures.
font_family      family="FiraCode Nerd Font NDD"
font_size        12
bold_font        auto
italic_font      auto
bold_italic_font auto

disable_ligatures no

font_features FiraCodeNerdFontNDD-Regular    +ss01 +ss03 +ss06 +ss07 +ss10 +cv02 +cv18 +cv25 +cv26 +cv27 +cv29 +cv32 +zero
font_features FiraCodeNerdFontNDD-Bold       +ss01 +ss03 +ss06 +ss07 +ss10 +cv02 +cv18 +cv25 +cv26 +cv27 +cv29 +cv32 +zero
font_features FiraCodeNerdFontNDD-Italic     +ss01 +ss03 +ss06 +ss07 +ss10 +cv02 +cv18 +cv25 +cv26 +cv27 +cv29 +cv32 +zero
font_features FiraCodeNerdFontNDD-BoldItalic +ss01 +ss03 +ss06 +ss07 +ss10 +cv02 +cv18 +cv25 +cv26 +cv27 +cv29 +cv32 +zero

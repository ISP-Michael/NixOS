# tmux.conf — hub. The order is intentional: base options, fallback theme,
# statusline layout, keys, session plugins, then the generated Noctalia theme.
source-file ~/.config/tmux/conf/options.conf
source-file ~/.config/tmux/themes/mocha.conf
source-file ~/.config/tmux/conf/statusline.conf
source-file ~/.config/tmux/conf/keys/panes.conf
source-file ~/.config/tmux/conf/keys/windows.conf
source-file ~/.config/tmux/conf/keys/copy-mode.conf
source-file ~/.config/tmux/conf/keys/reload.conf
source-file ~/.config/tmux/conf/session.conf
source-file -q "$XDG_CONFIG_HOME/tmux/themes/noctalia.conf"

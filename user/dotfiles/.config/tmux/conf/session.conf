# Session persistence. Plugins live in vendor/; ~/.config/tmux/vendor is a
# symlink to /etc/nixos/vendor/tmux, so these paths stay stable.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-boot 'on'
run-shell '~/.config/tmux/vendor/tmux-resurrect/resurrect.tmux'
run-shell '~/.config/tmux/vendor/tmux-continuum/continuum.tmux'

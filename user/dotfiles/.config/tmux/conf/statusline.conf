# Statusline layout and formats. Palette variables come from the active
# Noctalia-generated theme; mocha.conf provides a dark fallback when Noctalia
# is absent.
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_low}]#[fg=#{@noctalia_on_primary},bg=#{@noctalia_primary}] #S #[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_low}] "
set -g status-right "#[fg=#{@noctalia_tertiary_container},bg=#{@noctalia_surface_container_low}]#[fg=#{@noctalia_on_tertiary_container},bg=#{@noctalia_tertiary_container}] %H:%M #[fg=#{@noctalia_tertiary_container},bg=#{@noctalia_surface_container_low}]"
setw -g window-status-format "#[fg=#{@noctalia_outline_variant},bg=#{@noctalia_surface_container_low}]#[fg=#{@noctalia_on_surface_variant},bg=#{@noctalia_surface_container}] #I #[fg=#{@noctalia_surface_container},bg=#{@noctalia_surface_container_high}]#[fg=#{@noctalia_on_surface},bg=#{@noctalia_surface_container_high}] #W #[fg=#{@noctalia_surface_container_high},bg=#{@noctalia_surface_container_low}]"
setw -g window-status-current-format "#[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_low}]#[fg=#{@noctalia_on_primary},bg=#{@noctalia_primary}] #I #[fg=#{@noctalia_primary},bg=#{@noctalia_primary_container}]#[fg=#{@noctalia_on_primary_container},bg=#{@noctalia_primary_container}] #W #[fg=#{@noctalia_primary_container},bg=#{@noctalia_surface_container_low}]"
setw -g window-status-separator " "

# Pane navigation (prefix + hjkl). -Z keeps the pane zoomed: switching panes
# does not leave zoom mode.
bind -r h select-pane -Z -L
bind -r j select-pane -Z -D
bind -r k select-pane -Z -U
bind -r l select-pane -Z -R
bind -r Up select-pane -Z -U
bind -r Down select-pane -Z -D
bind -r Left select-pane -Z -L
bind -r Right select-pane -Z -R
bind o select-pane -Z -t :.+
bind \; last-pane -Z

# Pane resize (prefix + Shift+hjkl).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

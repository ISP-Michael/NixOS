# Windows and panes.
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind Tab next-window
bind BTab previous-window

# Window switcher (prefix + w / s / .). Three aliases for the same popup:
# w is the mnemonic, s is next to the pane keys, . is the old binding.
bind w run-shell -b 'exec ~/.config/tmux/scripts/winmenu.sh "#{socket_path}" "#{client_name}" "#{client_width}" "#{client_height}"'
bind s run-shell -b 'exec ~/.config/tmux/scripts/winmenu.sh "#{socket_path}" "#{client_name}" "#{client_width}" "#{client_height}"'
bind . run-shell -b 'exec ~/.config/tmux/scripts/winmenu.sh "#{socket_path}" "#{client_name}" "#{client_width}" "#{client_height}"'

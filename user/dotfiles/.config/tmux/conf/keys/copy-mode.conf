# Copy-mode (vi).
bind P paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi C-v send -X page-down
bind -T copy-mode-vi C-u send -X page-up

# Smooth wheel scrolling: three one-line steps with a server-side timer,
# matching kitty's own buffer scrolling.
bind -T copy-mode-vi WheelUpPane select-pane \; run-shell -b 'exec ~/.config/tmux/scripts/smooth-scroll.sh up "#{pane_id}"'
bind -T copy-mode-vi WheelDownPane select-pane \; run-shell -b 'exec ~/.config/tmux/scripts/smooth-scroll.sh down "#{pane_id}"'

# First wheel-up over a normal pane: enter copy-mode and scroll immediately
# instead of letting the stock binding swallow the tick.
bind -n WheelUpPane if -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -e ; run-shell -b 'exec ~/.config/tmux/scripts/smooth-scroll.sh up "#{mouse_pane}"' }

# Base tmux options. Prefix is Ctrl+Space.
set -g prefix C-Space
unbind C-b
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g escape-time 10
set -g repeat-time 300
set -g history-limit 50000
set -g focus-events on
setw -g mode-keys vi
set -g status-keys vi

# kitty: draw whole frames, no torn scrolling.
set -ga terminal-features "*:sync"

# Window names follow the current directory.
set -g allow-rename off
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Wayland environment for restored panes and clipboard helpers.
set -ga update-environment 'WAYLAND_DISPLAY XDG_RUNTIME_DIR HYPRLAND_INSTANCE_SIGNATURE'

# Catppuccin mocha fallback theme. Sourced before statusline.conf; the
# generated themes/noctalia.conf may override some styles later.

# Palette.
set -g @mocha_base      "#1e1e2e"
set -g @mocha_mantle    "#181825"
set -g @mocha_crust     "#11111b"
set -g @mocha_surface0  "#313244"
set -g @mocha_surface1  "#45475a"
set -g @mocha_surface2  "#585b70"
set -g @mocha_overlay2  "#9399b2"
set -g @mocha_text      "#cdd6f4"
set -g @mocha_peach     "#fab387"
set -g @mocha_mauve     "#cba6f7"
set -g @mocha_green     "#a6e3a1"

# Noctalia-compatible fallback palette. The generated noctalia.conf is
# sourced last and overrides these values when it exists.
set -g @noctalia_surface_container_low      "#1e1e2e"
set -g @noctalia_surface_container          "#181825"
set -g @noctalia_surface_container_high     "#313244"
set -g @noctalia_surface_container_highest  "#45475a"
set -g @noctalia_on_surface                 "#cdd6f4"
set -g @noctalia_on_surface_variant         "#9399b2"
set -g @noctalia_primary                    "#cba6f7"
set -g @noctalia_on_primary                 "#11111b"
set -g @noctalia_primary_container          "#cba6f7"
set -g @noctalia_on_primary_container       "#11111b"
set -g @noctalia_tertiary_container         "#fab387"
set -g @noctalia_on_tertiary_container      "#11111b"
set -g @noctalia_outline_variant            "#585b70"

# Styles used when Noctalia does not provide the generated theme.
set -g status-style "bg=#{@mocha_base},fg=#{@mocha_text}"

# tmux 3.8 changed the defaults: the current tab became underlined and popup
# became themedarkgrey. Restore the previous look.
setw -g window-status-current-style "default"
setw -g popup-style "bg=default,fg=default"

set -g message-style "bg=#{@mocha_surface1},fg=#{@mocha_text}"
set -g message-command-style "bg=#{@mocha_surface1},fg=#{@mocha_text}"
set -g menu-style "bg=#{@mocha_mantle},fg=#{@mocha_text}"
set -g menu-selected-style "bg=#{@mocha_mauve},fg=#{@mocha_crust}"
set -g menu-border-style "fg=#{@mocha_surface2},bg=#{@mocha_mantle}"
set -g menu-border-lines rounded
set -g pane-border-style "fg=#{@mocha_surface1}"
set -g pane-active-border-style "fg=#{@mocha_mauve}"
set -g pane-border-lines heavy
set -g display-panes-active-colour "#cba6f7"
set -g display-panes-colour "#45475a"
set -g clock-mode-colour "#89b4fa"

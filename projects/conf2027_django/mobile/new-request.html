<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новая заявка — Конференции.РФ</title>
<link rel="stylesheet" href="../static/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="#"><span class="logo-mark" aria-hidden="true">К</span><span class="logo-text">Конференции<em>.РФ</em></span></a>
    <nav class="main-nav" aria-label="Основная навигация">
      <a href="requests.html">Мои заявки</a>
      <a class="btn btn-primary btn-sm" href="#">Создать заявку</a>
    </nav>
  </div>
</header>

<main class="container" id="main">
  <section class="card card-narrow" aria-labelledby="h-new">
    <h1 id="h-new">Формирование заявки</h1>
    <p class="muted">Заявка поступит на рассмотрение администратору портала.</p>

    <form method="post" class="form" novalidate>
      <div class="form-group">
        <label for="m-room">Помещение</label>
        <input type="text" id="m-room" name="room_name" placeholder="Например: Аудитория 101">
      </div>
      <div class="form-group">
        <label for="m-date">Дата начала конференции</label>
        <input type="date" id="m-date" name="event_date" value="2026-11-20">
      </div>
      <div class="form-group">
        <label for="m-pay">Способ оплаты</label>
        <select id="m-pay" name="payment_method">
          <option value="cash">Наличными</option>
          <option value="sbp">СБП</option>
          <option value="card">Банковской картой</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Отправить</button>
    </form>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>Портал «Конференции.РФ» — бронирование помещений для Всероссийских конференций.</p>
  </div>
</footer>

</body>
</html>

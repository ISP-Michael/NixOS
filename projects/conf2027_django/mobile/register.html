<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — Конференции.РФ</title>
<link rel="stylesheet" href="../static/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="#"><span class="logo-mark" aria-hidden="true">К</span><span class="logo-text">Конференции<em>.РФ</em></span></a>
    <nav class="main-nav" aria-label="Основная навигация">
      <a href="login.html">Вход</a>
      <a class="btn btn-primary btn-sm" href="#">Регистрация</a>
    </nav>
  </div>
</header>

<main class="container" id="main">
  <section class="card card-narrow" aria-labelledby="h-reg">
    <h1 id="h-reg">Регистрация</h1>
    <p class="muted">Все поля обязательны, кроме пароля: если оставить его пустым, система придумает пароль и покажет один раз.</p>

    <form method="post" class="form" novalidate>
      <div class="form-group">
        <label for="m-login">Логин</label>
        <input type="text" id="m-login" name="username" placeholder="Только латиница и цифры, от 6 символов">
      </div>
      <div class="form-group">
        <label for="m-pass">Пароль</label>
        <input type="password" id="m-pass" name="password" placeholder="Не менее 8 символов">
      </div>
      <div class="form-group">
        <label for="m-pass2">Пароль ещё раз</label>
        <input type="password" id="m-pass2" name="password2" placeholder="Повторите пароль">
      </div>
      <div class="form-group">
        <label for="m-fio">ФИО</label>
        <input type="text" id="m-fio" name="fio" placeholder="Иванов Иван Иванович">
      </div>
      <div class="form-group">
        <label for="m-phone">Телефон</label>
        <input type="tel" id="m-phone" name="phone" placeholder="8(999)123-45-67">
      </div>
      <div class="form-group">
        <label for="m-email">Электронная почта</label>
        <input type="email" id="m-email" name="email" placeholder="ivanov@example.ru">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
    </form>

    <p class="form-footer">
      <a href="login.html">Уже есть аккаунт? Войти</a>
    </p>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>Портал «Конференции.РФ» — бронирование помещений для Всероссийских конференций.</p>
  </div>
</footer>

</body>
</html>
